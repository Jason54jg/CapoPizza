# Workflow officiel GitHub : Next.js → GitHub Pages
# https://docs.github.com/fr/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow
# https://github.com/actions/starter-workflows/blob/main/pages/nextjs.yml

name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rafraîchit note / nombre d’avis Google (Maps via Playwright) puis redéploie
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # basePath /CapoPizza : next.config.ts (GITHUB_PAGES=true).
      # Pages doit être activé : Settings → Pages → Source « GitHub Actions ».

      - name: Install dependencies
        run: npm ci

      # Avis Google rafraîchis par le script « prebuild » de npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # L’export statique n’accepte pas les Route Handlers
      - name: Strip API routes for static export
        run: rm -rf app/api

      - name: Build with Next.js
        run: npm run build
        env:
          # Site projet : https://<owner>.github.io/CapoPizza/
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ANALYTICS_URL: https://webdashbord-one.vercel.app
          # Thème saisonnier : laisser site.theme.config.ts (none | halloween | christmas)
          # Pour forcer en CI : NEXT_PUBLIC_SEASONAL_THEME: halloween

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
