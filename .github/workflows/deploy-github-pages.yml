name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publication sur la branche gh-pages (Settings → Pages → branch gh-pages / root)
permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (basePath /CapoPizza)
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Disable Jekyll on GitHub Pages
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          commit_message: "deploy: site Capo Pizza"
